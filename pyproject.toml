[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laser-support-desk"
version = "0.1.0"
description = "Three support agents on one durable session log, built on Laser SDK"
requires-python = ">=3.11"
dependencies = [
  "laser-sdk==0.4.0",
  "aiohttp>=3.9",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[tool.setuptools]
packages = ["desk"]

[tool.setuptools.package-data]
desk = ["static/*.html"]
