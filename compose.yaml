# Jaeger for the traces (UI on http://localhost:16686, OTLP/HTTP on 4318).
# Laser Stack itself runs from its own checkout; see README.md.
services:
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4318:4318"
